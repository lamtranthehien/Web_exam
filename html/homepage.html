<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>

    <style>
        #header{
            background-color: black;
        }
        #login,#register{
            text-decoration: none;
            color: white;
        }
        #login:hover,#register:hover{
            color: green;
            
        }
        .material-symbols-outlined{
            color: white;
        }
        a{
            text-decoration: none;
            color: white;
            font-family: 'Times New Roman', Times, serif;
        }
        #links:hover{
            color: aqua;
        }
        section{
            background-color: black;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row" id="header">
           <div class="d-flex justify-content-between align-items-center w-100">
            <a href="#"><img 
             src="../img/logo.png" 
             alt="logo"
             style="max-width: 100%;max-height:100px ;"></a>
             
            <a href="#" id="links">Home</a>
            <a href="#" id="links">Shop</a> 
            <a href="#" id="links">About</a>
             
             <div class="auth-links">
                 <input type="text" class="border-dark" style="border-radius: 10px;width: 500px;" placeholder="Searching the books">
                 <span class="material-symbols-outlined">
                    search
                    </span>
                <a href="#" id="login" data-bs-toggle="modal" data-bs-target="#login_modal">Đăng nhập/</a><a href="#" id="register" data-bs-toggle="modal" data-bs-target="#register_modal">Đăng kí</a>
                <span class="material-symbols-outlined">
                    shopping_cart
                    </span>
             </div>
           </div>
        </div>
        <div class="row">
            <div class="d-flex justify-content-between w-100 bg-black">
                <section class="containe-fluid d-flex flex-column align-items-center" style="width: 50%; height: 100%;padding-top: 35%;">
                    <h1 style="color: white; font-family: 'Times New Roman', Times, serif;">See All Product</h1>\
                    <h4 style="color: green; font-family: 'Times New Roman', Times, serif;">Discount 5% from now</h4>
                    <button style="border-radius: 10px;width: 100px;">Show all</button>
                </section>
                <aside>
                    <img src="../img/bookexam.jpg" alt="books" style="width: 100%; height: 100%;">
                </aside>
            </div>  
        </div>
    </div>
    <div class="modal" id="login_modal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">Đăng Nhập</div>
                    <button type="button" data-bs-dismiss="modal" class="btn-close"></button>
                </div>
                <div class="modal-body d-flex justify-content-center flex-column align-items-center">
                        <h5 style="width: 30%;margin-left:-160px;">Tên đăng nhập</h5>
                        <input type="text" style="width:70%;">
                        <br>
                        <h5 style="width: 30%;margin-left:-160px;">Mật khẩu</h5>
                        <input type="text" style="width:70%;">
                </div>
                <div class="footer d-flex justify-content-center align-content-center">
                    <button type="button" class="btn btn-success">Đăng nhập</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
